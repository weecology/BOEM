name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Set up Python
        run: uv python install

      - name: Install package
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest tests/ -v -m "not slow"
