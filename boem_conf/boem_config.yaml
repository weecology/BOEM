defaults:
  - _self_
  - server: serenity
  - classification_model: finetune.yaml
  - hierarchical: hierarchical.yaml
  - annotation: label_studio

hydra:
  run:
    dir: /blue/ewhite/b.weinstein/BOEM/hydra_runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /blue/ewhite/b.weinstein/BOEM/hydra_multirun
    subdir: ${hydra.job.num}
  output_subdir: null
  job:
    chdir: False

debug: False

comet:
  project: BOEM
  workspace: bw4sz

check_annotations: false
# Force upload bypasses the pipeline, useful for debugging and starting a new project
force_upload: False
image_dir: /blue/ewhite/b.weinstein/BOEM/imagery/JPG_20241107_135800
# Namespace for crop/checkpoint dirs, caches, and metadata lookup. Defaults to the
# image_dir basename. Override when leaf dir names repeat across flights — neaq gives
# every date a "Belly camera edited", which would collide into a single namespace.
flight_name: null

predict:
  patch_size: 1000
  patch_overlap: 0
  # PAIRING VERIFIED FOR THE CURRENT CHECKPOINT (job 41939457, 2026-09-13).
  # The foam risk described below was measured and did NOT materialise — the opposite
  # happened. On the two foam-heavy July flights (JPG_20260712_100400 + JPG_20260712_113200,
  # 3,000-frame sample) 1968e962/epoch29 emits FEWER boxes at 0.70 than a09c6933 did on the
  # same flights: 0.67 boxes/1k vs 2.08 boxes/1k (120 boxes over 57,657 frames). Across the
  # band it is ~3.5x more conservative at 0.40 (126 boxes/1k vs the 0.40-era 25,280 boxes
  # over those same 57,657 frames = 438/1k).
  # That is the profile of a model that learned to REJECT foam while scoring real animals
  # higher — consistent with its training corpus, which is the first to include the July
  # review pass's 52 human-marked FalsePositives as hard negatives.
  # CAVEAT, do not over-read: 0.67 boxes/1k on a 3,000-frame sample is TWO boxes. It is at
  # the sample's resolution limit, so it supports "no foam excess" but cannot settle whether
  # the new model is now too conservative on July imagery. The Feb zero-shot holdout says its
  # recall is better (94.2% vs 75.8% image recall), but Feb and July imagery differ sharply
  # (79.1% of Feb boxes sit above 0.85 vs 1.4% of July ones), so that does not fully transfer
  # either. A July-imagery recall answer needs reviewed July ground truth, which does not
  # exist outside the pinned Feb pair.
  # Original (now-closed) risk statement kept below for the reasoning:
  # 0.70 was calibrated for a09c69331af8496380cbf99e3859d656/epoch16 on JULY SURVEY imagery
  # (see the derivation below). detection_model.checkpoint moved to 1968e962/epoch29 on
  # 2026-09-13, and this value has NOT been re-derived on survey imagery for it.
  # What IS known for 1968e962, on the pinned Feb ZERO-SHOT holdout (jobs 41840299/41840640):
  # 0.70 gives image recall 94.2% / box precision 86.6%, comfortably better than a09c6933 at
  # the same cut, so 0.70 is a SAFE-OR-BETTER starting point on that substrate and holding it
  # cannot silently lose frames relative to the model being replaced.
  # The open risk is the other direction: 1968e962 scores higher overall (max 0.993 on the
  # holdout vs a09c6933's 0.931), so on July imagery it may push FOAM above 0.70 that
  # a09c6933 kept below. The 0.70 value exists precisely to exclude that foam, and the
  # lesson of 2026-08-20 is that a threshold does not transfer between checkpoints.
  # The survey-imagery derivation called for here WAS run: job 41939457, result at the top
  # of this comment. Remaining unmeasured piece is per-class share clearing the cut and an
  # eyeball of the Morus crops, which needs a survey run on the new checkpoint to produce.
  # Re-derive with scripts/threshold_sweep.py whenever detection_model.checkpoint changes.
  #
  # 0.70 chosen 2026-08-20, on SURVEY imagery. This supersedes the 0.30 set on 2026-08-13
  # from the Feb holdout sweep (job 39385379: img recall 97.8%, box recall 63.0%, prec
  # 78.4% at 0.30). That sweep measured the pinned zero-shot Feb pair, where 79.1% of
  # boxes already sat above 0.85; the July survey has 1.4% there. The threshold did not
  # transfer, and the 0.30 pool turned out to be 98.5% foam.
  # What DOES separate real animals from foam on July imagery is detection score alone:
  #   - 19 Morus bassanus crops, eyeballed: the 8 real birds are exactly the 8 with
  #     score >= 0.65 (0.664-0.831); all 11 foam crops fall in 0.400-0.573. No exceptions.
  #   - Per-class share clearing 0.65 on the 20-flight survey: Thalasseus maximus 86.7%
  #     (median 0.811) vs Clangula 0.3%, Chelonioidea 0.6%, Gavia 0.5%, Somateria 2.0%.
  #     One class behaves like a species; the mass classes behave like nothing.
  # Classifier confidence CANNOT substitute: median cropmodel_score on the foam sinks is
  # 0.98-0.99. The classifier is maximally confident on foam. Detection score is the only
  # signal that discriminates, which is why this gate carries the whole burden.
  # Cost: the 20-flight survey pool goes 41,739 boxes (>=0.40) -> 388 (>=0.70).
  # Box recall ceilings at 67.8% even at thresh 0.05, so a third of objects are invisible
  # to this detector at ANY threshold. That is a detector problem, not a threshold one.
  # NOTE: as of 2026-08-20 this value is also pushed into the live model's score_thresh by
  # detection.load(), so the detector genuinely stops emitting below it. Before that fix
  # the model's baked-in 0.4 floor silently overrode any lower setting here.
  # 0.70 is the gate for THIS pipeline. The per-survey overrides are deliberately left at
  # 0.5 and are not oversights: submit_seals_array.sh, submit_seals_missing_metadata.sh
  # (seal detections peak ~0.89 even on obvious animals) and submit_neaq.sh (retired; its
  # imagery is already a 0.5-screened subset, so a higher floor recovers nothing).
  min_score: 0.70
  # This counts IMAGES, not patches: predict_tile(dataloader_strategy="batch") batches
  # whole images and flattens their crops, so one forward pass sees
  # batch_size * 35 patches for this ~6464x4852 camera. batch_size=1 therefore already
  # puts all 35 patches of an image in a single pass.
  # Benchmarked on one B200 (job 39225777, 60 images of JPG_20260712_100400): throughput
  # is inversely related to batch size and peak memory is linear at ~6.4 GB per image.
  #   1 -> 3.88 img/s,   6.5 GB      8 -> 2.66 img/s,  50.8 GB
  #   2 -> 3.69 img/s,  12.8 GB     16 -> 2.50 img/s, 101.5 GB
  #   4 -> 3.28 img/s,  25.5 GB     24 -> 1.49 img/s, 152.2 GB
  # 32 and above OOM the 179 GB card. The workload is data-bound (JPEG decode + Lustre
  # read + patch construction), not GPU-bound, which is why a bigger batch only hurts.
  # Scale out across GPUs instead of raising this. ~3.9 img/s = ~13.5 h per TB per GPU.
  batch_size: 1
  workers: 5
  # For web viz, expand pixels on all sides
  buffer: 60


pipeline:
  confidence_threshold: 0.6
  limit_empty_frac: 0.001
  gpus: 1

propagate:
  time_threshold_seconds: 5
  distance_threshold_pixels: 50

detection_model:
  force_train: False
  # Comet 1968e962113f4c57bc6bf5f07fae1b25, epoch29 (val_classification 0.0899) — job
  # 40994172, trained 2026-09-03 on the corpus refreshed with the completed July review
  # pass. PROMOTED 2026-09-13, replacing a09c6933/epoch16.
  #
  # Promoted on ZERO-SHOT holdout evidence (jobs 41840299 / 41840640, the pinned Feb pair
  # JPG_20260201_134000 + JPG_20260202_141900 — 648 fully-reviewed frames, 1,229 objects).
  # At the SAME predict.min_score 0.70, zero-shot:
  #     1968e962/epoch29   image recall 94.2%  box recall 57.9%  box precision 86.6%
  #     a09c6933/epoch16   image recall 75.8%  box recall 44.3%  box precision 90.2%
  # +18.4 points of image recall for -3.6 of precision. The box-recall CEILING (lowest
  # threshold, i.e. what no threshold choice can recover) also rose 67.8% -> 71.4%, so this
  # is a better detector and not merely a better-calibrated one.
  # These are ZERO-SHOT numbers. Do NOT quote them as validation recall, and do not compare
  # them to the ~0.06-0.80 box_recall on any Comet training run: that metric is ceilinged by
  # the empty-frame ratio of whatever split it was computed on and is not comparable across
  # runs (deepforest_box_recall_issue.md). No trustworthy in-distribution validation box
  # recall exists for either checkpoint.
  # Ignore box_recall on the Comet run for the same reason.
  checkpoint: /blue/ewhite/b.weinstein/BOEM/training/checkpoints/1968e962113f4c57bc6bf5f07fae1b25/epoch29-val_cls0.0899.ckpt
  checkpoint_dir: /blue/ewhite/b.weinstein/BOEM/detection/checkpoints
  patch_size: 1000
  patch_overlap: 0
  crop_image_dir: /blue/ewhite/b.weinstein/BOEM/detection/crops/
  limit_empty_frac: 0.001
  labels:
    - "Object"
  trainer: 
    batch_size: 20
    train:
      fast_dev_run: False
      epochs: 4
      lr: 0.00001
    workers: 0
    validation:
      val_accuracy_interval: 5

pipeline_evaluation:
  # This is an average mAP threshold for now, but we may want to add a per-iou threshold in the future
  detection_true_positive_threshold: 0.8
  # CALIBRATED SCALE (classification_model.temperature). 0.5 raw -> 0.12 by val quantile.
  # Splits confident/uncertain for evaluation only; see human_review.review_high.
  classification_threshold: 0.12

active_learning:
  strategy: taxonomy
  n_images: 100
  patch_size: 1000
  patch_overlap: 0
  # CALIBRATED SCALE (classification_model.temperature). 0.3 raw -> 0.07; the val quantile
  # equivalent is 0.066. A floor in select_images/report, not the review band -- see
  # human_review.review_high for the full list of thresholds that must move together.
  min_classification_score: 0.07
  # THIRD detection gate, independent of predict.min_score and human_review.
  # min_detection_score. 0.8 -> 0.30 on 2026-08-14, -> 0.70 on 2026-08-20.
  # All three gates are calibrated together for a09c6933/epoch16 and MUST move together —
  # see predict.min_score for the derivation of 0.70. Keep this >= predict.min_score: the
  # pool is already cut there, so anything lower is a no-op.
  # The 2026-08-14 move to 0.30 was made because only 91 survey boxes cleared 0.85 across
  # 533,876 images, which starved this queue. 0.70 keeps the queue fed (388 boxes on the
  # 20-flight survey) without selecting images off foam.
  min_detection_score: 0.70
  model_checkpoint:
  target_labels:
    - "Tursiops truncatus"

  # Taxonomy strategy: set strategy: taxonomy and taxonomy_aliases to select images by higher taxon
  # (uses transformed_taxonomy.json to expand e.g. Aves -> all bird species, Cepphus -> guillemots).
  taxonomy_path: /blue/ewhite/b.weinstein/src/BOEM/transformed_taxonomy.json
  taxonomy_aliases:
    # Seals: Phocidae expands to its leaves (Halichoerus/H. grypus, Phoca/P. vitulina),
    # then gets filtered to the labels the classification model actually knows.
    - 'Phocidae'  # e.g. [Aves, Mammalia, Cepphus] for Birds, Mammals, or Guillemots

  # Rarest strategy parameters:
  drop_n_most_common: 5  # Number of most common classes to drop
  rarest_confidence_selection: highest  # "highest" or "lowest" - select highest or lowest confidence samples from rarest classes

  # Crop + H-CAST ensemble (requires hierarchical.checkpoint for match_or_genus_consistent and model-disagreement):
  # ensemble_target_mode: crop_only  # crop_only | match_or_genus_consistent — for target-labels / taxonomy
  # strategy: model-disagreement  # prioritize images where cropmodel_label != hcast_species
  # disagreement_require_genus_mismatch: false  # if true, exclude congeneric species disagreements
  # disagreement_target_labels: []  # optional list — keep disagreements where crop OR H-CAST species is in this set

  # Optional parameters:
  evaluation:
  dask_client:
  pool_limit: 500

active_testing:
  strategy: random
  n_images: 1
  m: 
  patch_size: 1000
  patch_overlap: 0
  # DEAD KEY as of 2026-08-20: nothing reads active_testing.min_score. Test images are
  # drawn from the pool, which predict.min_score has already cut. Kept at 0.70 so it does
  # not contradict the real gates if something ever starts reading it.
  min_score: 0.70

human_review:
  n: 30
  # A box goes to review when the detector is confident but the classifier is not:
  #   score >= min_detection_score AND review_low <= cropmodel_score <= review_high.
  # Below review_low the classifier had nothing to say and the detection is most likely
  # spurious; above review_high it is auto-annotated (confident_predictions).
  # Keep min_detection_score >= predict.min_score — the pool is already cut at that value,
  # so anything lower is a no-op.
  # MUST MOVE WITH predict.min_score. active_learning.py:161 applies this as an
  # independent hard cut, so a stale value here silently filters out every box the pool
  # just produced. 0.85 -> 0.30 on 2026-08-14, -> 0.70 on 2026-08-20.
  min_detection_score: 0.70
  # ALL cropmodel_score thresholds below are on the TEMPERATURE-SCALED scale
  # (classification_model.temperature = 5.6136). They are meaningless on the raw scale and
  # must ALL move together if that key changes or is set to null. The full list:
  #   human_review.review_low / review_high      (this block)
  #   active_learning.min_classification_score
  #   pipeline_evaluation.classification_threshold
  #   report.rare_species_min_score
  #
  # History: 0.6 -> 0.99 (raw) on 2026-08-20, then -> 0.50 (calibrated) the same day.
  #
  # Why the raw scale had to go. On the a3dc30a0 val split the classifier was grossly
  # miscalibrated in LEVEL -- mean confidence 0.965 against 0.756 accuracy, ECE 0.209, with
  # 80.9% of all crops piled into [0.99, 1.0]. Every threshold below 0.99 sat in a near-empty
  # region: the original [0.3, 0.6] band held 2.6% of val crops and 7.0% of all errors, and on
  # the 20-flight July survey it held 28 boxes / 27 images against human_review.n=30. It was
  # not prioritising anything. 0.99 fixed the emptiness but was pure percentile -- it had to be
  # re-swept on every retrain, and float32 softmax saturation (43.2% of val crops return
  # EXACTLY 1.0) makes anything above ~0.999 unimplementable on the raw scale anyway.
  #
  # After temperature scaling: ECE 0.209 -> 0.070, share >= 0.99 goes 0.809 -> 0.076, median
  # confidence 1.0000 -> 0.797. The score uses its range and 0.50 means what it says --
  # review anything the classifier is worse than even odds on.
  # At 0.50 on the val split: 24.6% of crops reviewed, 51.1% of all errors caught, 50.6% of
  # the reviewed batch actually wrong (2.08x the 24.4% base rate), and the auto-annotated
  # remainder runs at 0.842 accuracy. The quantile-preserving equivalent of the old raw 0.99
  # was 0.4293; 0.50 was chosen over it because it is semantically defensible and portable,
  # and the queue is capped by human_review.n anyway so a wider pool only improves selection.
  #
  # KNOWN COST, accepted deliberately: calibration slightly HURT ranking, AUROC 0.796 -> 0.770
  # (temperature is monotone in the logits but not in max-softmax, so boxes with different
  # runner-up structure reorder). This threshold buys interpretability and portability, not a
  # better queue. See JOB_LEDGER.md 39825931.
  #
  # Ordering inside the band is by DETECTION score (pipeline.py), not classifier score, and
  # that is deliberate: detection score is the only foam discriminator (see predict.min_score).
  #
  # review_low is the calibrated equivalent of the old 0.3 (val quantile maps it to 0.066) and
  # remains nearly inert -- 0 of 388 gated survey boxes fell below the old value. It is a guard
  # against a degenerate classifier, not a working filter.
  review_low: 0.05
  review_high: 0.50
  # Send a box to review when the CropModel and H-CAST name different species, whatever its
  # confidence, and put those boxes at the FRONT of the queue (detection score still orders
  # within each group -- it is the only foam discriminator).
  #
  # Measured on the a3dc30a0 val split (3,695 crops, 900 classifier errors), at matched budget:
  #   confidence band [0.05, 0.50]  24.6% reviewed, 51.1% of errors caught, 50.6% precision
  #   model disagreement            24.3% reviewed, 66.4% of errors caught, 66.5% precision
  #   union of the two              35.5% reviewed, 77.4% of errors caught, 53.1% precision
  # The band is blind to a CONFIDENT error, which is the failure that matters: the boxes the
  # flat model called Larus delawarensis at 1.000 confidence were dolphins. Disagreement sees
  # them. Setting this false restores the pre-2026-08-26 band-only behaviour; it is also a
  # no-op when hierarchical.checkpoint is null, since there are no hcast_* columns to compare.
  review_on_disagreement: true

report:
  enabled: true
  # NOTE 2026-08-20: the July 2026 survey's capture CSVs live one level DEEPER, in a
  # nested duplicate `metadata_aflight_csvs/metadata_aflight_csvs/`. The outer dir has
  # 230 captures files and none for 202607; the inner has 254 and covers 19 of the 20
  # July flights. Pointing at the outer dir made generate_report() bail at
  # "could not load geospatial metadata" for every July flight, so the 2026-08-20 survey
  # refresh produced no reports at all. The two dirs should be consolidated (the inner is
  # a near-superset — the only file it lacks is 20211201_125800_captures.csv); until then
  # this points at the inner one.
  metadata_dir: /blue/ewhite/b.weinstein/BOEM/metadata_aflight_csvs/metadata_aflight_csvs
  n_sample_crops: 5
  n_rare_species: 2
  # CALIBRATED SCALE (classification_model.temperature). 0.7 raw -> 0.21 by val quantile.
  # Picks high-confidence rare-species crops for the report; see human_review.review_high.
  rare_species_min_score: 0.21

  # Taxonomic rollup: report the FINEST rank at which the flat CropModel and
  # H-CAST agree, instead of trusting the CropModel species alone.
  #   species agree            -> species
  #   species differ, genus same  -> genus
  #   genus differs, family same  -> family
  #   no agreement                -> unresolved (counted separately, not as a species)
  # Neither model overrides the other; disagreement costs resolution, not a coin flip.
  # Writes consensus_label/consensus_rank/consensus_score into the observations
  # tables and shapefile, plus taxonomic_summary.csv.
  taxonomic_rollup:
    enabled: true
    # Optional confidence floor. When set, a row whose joint confidence
    # (min of the two contributing scores) falls below it is demoted one further
    # rank. null = agreement alone decides the rank, which is the current setting:
    # the rollup ladder is pure LABEL comparison and no score is consulted.
    #
    # IF YOU SET THIS, it is a sixth cropmodel_score threshold and belongs on the
    # calibrated scale — see human_review.review_high for the other five. Two reasons:
    #   1. A row with no H-CAST score resolves to _joint(crop_score), i.e. the crop score
    #      alone (hierarchical.py:587), so this is a crop-scale floor even without H-CAST.
    #   2. With H-CAST it is min(cropmodel_score, hcast_*_score), and H-CAST is NOT
    #      temperature-scaled. On raw scores the crop score wins that min on 17% of gated
    #      survey boxes (median crop 0.981 vs H-CAST 0.629); calibrated crop scores land in
    #      H-CAST's range, so the min starts selecting a different model's number. Comparing
    #      the two on quantiles, or fitting a T for H-CAST, is the fix if this is enabled.
    min_consensus_score: null
    # Broad species -> genus/family source, used for crop-model classes that are
    # absent from hierarchical.label_csv (the CropModel has 70 classes, the wired
    # H-CAST has 37). Falls back to the first token of the binomial on a miss.
    taxonomy_path: /blue/ewhite/b.weinstein/src/BOEM/taxonomy.json

# Flythrough video: generate from cached predictions and log to Comet at end of run.
flythrough_video:
  enabled: true
  # output_dir: null  # default: /blue/ewhite/b.weinstein/BOEM/flight_videos
