defaults:
  - _self_
  - server: serenity
  - classification_model: finetune.yaml
  - hierarchical: hierarchical.yaml
  - annotation: label_studio

hydra:
  run:
    dir: /blue/ewhite/b.weinstein/BOEM/hydra_runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /blue/ewhite/b.weinstein/BOEM/hydra_multirun
    subdir: ${hydra.job.num}
  output_subdir: null
  job:
    chdir: False

debug: False

comet:
  project: BOEM
  workspace: bw4sz

check_annotations: false
# Force upload bypasses the pipeline, useful for debugging and starting a new project
force_upload: False
image_dir: /blue/ewhite/b.weinstein/BOEM/imagery/JPG_20241107_135800
# Namespace for crop/checkpoint dirs, caches, and metadata lookup. Defaults to the
# image_dir basename. Override when leaf dir names repeat across flights — neaq gives
# every date a "Belly camera edited", which would collide into a single namespace.
flight_name: null

predict:
  patch_size: 1000
  patch_overlap: 0
  # CALIBRATED FOR a09c69331af8496380cbf99e3859d656/epoch16 — this value is meaningless
  # without that pairing, which is precisely how it went wrong before. Re-derive with
  # scripts/threshold_sweep.py whenever detection_model.checkpoint changes.
  # Job 39385379 (2026-08-13), 648 human-reviewed holdout frames / 1,229 objects from the
  # pinned zero-shot pair (JPG_20260202_141900 + JPG_20260201_134000), greedy IoU 0.4:
  #   thresh  img recall  box recall  prec    queue img/1k
  #     0.15      99.8%       66.1%   70.7%      112.0
  #     0.20      99.0%       65.0%   74.7%       51.0
  #     0.30      97.8%       63.0%   78.4%       15.5   <- chosen
  #     0.50      94.1%       57.9%   84.4%        1.0
  #     0.85      29.9%       15.9%   98.0%        1.0   <- the old value
  # 0.85 was inherited from the differently-calibrated a1c5649 and discarded ~70% of
  # occupied frames. Image-level recall is the metric that matters: an annotator labels
  # every object in a frame they are handed, so a box missed inside a QUEUED frame is
  # recovered for free — only a frame that never gets queued is truly lost.
  # Box recall ceilings at 67.8% even at thresh 0.05, so a third of objects are invisible
  # to this detector at ANY threshold. That is a detector problem, not a threshold one.
  min_score: 0.30
  # This counts IMAGES, not patches: predict_tile(dataloader_strategy="batch") batches
  # whole images and flattens their crops, so one forward pass sees
  # batch_size * 35 patches for this ~6464x4852 camera. batch_size=1 therefore already
  # puts all 35 patches of an image in a single pass.
  # Benchmarked on one B200 (job 39225777, 60 images of JPG_20260712_100400): throughput
  # is inversely related to batch size and peak memory is linear at ~6.4 GB per image.
  #   1 -> 3.88 img/s,   6.5 GB      8 -> 2.66 img/s,  50.8 GB
  #   2 -> 3.69 img/s,  12.8 GB     16 -> 2.50 img/s, 101.5 GB
  #   4 -> 3.28 img/s,  25.5 GB     24 -> 1.49 img/s, 152.2 GB
  # 32 and above OOM the 179 GB card. The workload is data-bound (JPEG decode + Lustre
  # read + patch construction), not GPU-bound, which is why a bigger batch only hurts.
  # Scale out across GPUs instead of raising this. ~3.9 img/s = ~13.5 h per TB per GPU.
  batch_size: 1
  workers: 5
  # For web viz, expand pixels on all sides
  buffer: 60


pipeline:
  confidence_threshold: 0.6
  limit_empty_frac: 0.001
  gpus: 1

propagate:
  time_threshold_seconds: 5
  distance_threshold_pixels: 50

detection_model:
  force_train: False
  # Comet a09c69331af8496380cbf99e3859d656, epoch16 (val_classification 0.0163) — chosen
  # 2026-08-12 over d1248ed8/epoch09 (0.0144) for the JPG_202607* run.
  # Ignore box_recall on the Comet run (~0.06): see deepforest_box_recall_issue.md, empty
  # frames count in the denominator but never the numerator.
  checkpoint: /blue/ewhite/b.weinstein/BOEM/training/checkpoints/a09c69331af8496380cbf99e3859d656/epoch16-val_cls0.0163.ckpt
  checkpoint_dir: /blue/ewhite/b.weinstein/BOEM/detection/checkpoints
  patch_size: 1000
  patch_overlap: 0
  crop_image_dir: /blue/ewhite/b.weinstein/BOEM/detection/crops/
  limit_empty_frac: 0.001
  labels:
    - "Object"
  trainer: 
    batch_size: 20
    train:
      fast_dev_run: False
      epochs: 4
      lr: 0.00001
    workers: 0
    validation:
      val_accuracy_interval: 5

pipeline_evaluation:
  # This is an average mAP threshold for now, but we may want to add a per-iou threshold in the future
  detection_true_positive_threshold: 0.8
  classification_threshold: 0.5

active_learning:
  strategy: taxonomy
  n_images: 100
  patch_size: 1000
  patch_overlap: 0
  min_classification_score: 0.3
  # THIRD detection gate, independent of predict.min_score and human_review.
  # min_detection_score. Lowered 0.8 -> 0.30 on 2026-08-14 alongside the other two: the
  # whole 20-flight JPG_202607* survey produced only 91 boxes >= 0.85 across 533,876
  # images, so a 0.8 floor here left the active-learning training queue selecting from
  # almost nothing regardless of what predict.min_score was set to.
  # All three gates are calibrated together for a09c6933/epoch16 — see predict.min_score.
  min_detection_score: 0.30
  model_checkpoint:
  target_labels:
    - "Tursiops truncatus"

  # Taxonomy strategy: set strategy: taxonomy and taxonomy_aliases to select images by higher taxon
  # (uses transformed_taxonomy.json to expand e.g. Aves -> all bird species, Cepphus -> guillemots).
  taxonomy_path: /blue/ewhite/b.weinstein/src/BOEM/transformed_taxonomy.json
  taxonomy_aliases:
    # Seals: Phocidae expands to its leaves (Halichoerus/H. grypus, Phoca/P. vitulina),
    # then gets filtered to the labels the classification model actually knows.
    - 'Phocidae'  # e.g. [Aves, Mammalia, Cepphus] for Birds, Mammals, or Guillemots

  # Rarest strategy parameters:
  drop_n_most_common: 5  # Number of most common classes to drop
  rarest_confidence_selection: highest  # "highest" or "lowest" - select highest or lowest confidence samples from rarest classes

  # Crop + H-CAST ensemble (requires hierarchical.checkpoint for match_or_genus_consistent and model-disagreement):
  # ensemble_target_mode: crop_only  # crop_only | match_or_genus_consistent — for target-labels / taxonomy
  # strategy: model-disagreement  # prioritize images where cropmodel_label != hcast_species
  # disagreement_require_genus_mismatch: false  # if true, exclude congeneric species disagreements
  # disagreement_target_labels: []  # optional list — keep disagreements where crop OR H-CAST species is in this set

  # Optional parameters:
  evaluation:
  dask_client:
  pool_limit: 500

active_testing:
  strategy: random
  n_images: 1
  m: 
  patch_size: 1000
  patch_overlap: 0
  min_score: 0

human_review:
  n: 30
  # A box goes to review when the detector is confident but the classifier is not:
  #   score >= min_detection_score AND review_low <= cropmodel_score <= review_high.
  # Below review_low the classifier had nothing to say and the detection is most likely
  # spurious; above review_high it is auto-annotated (confident_predictions).
  # Keep min_detection_score >= predict.min_score — the pool is already cut at that value,
  # so anything lower is a no-op.
  # MUST MOVE WITH predict.min_score. active_learning.py:161 applies this as an
  # independent hard cut, so leaving it at 0.85 while predict.min_score drops to 0.30
  # would re-predict the whole survey and then filter every new box back out before it
  # ever reached a human.
  min_detection_score: 0.30
  review_low: 0.3
  review_high: 0.6

report:
  enabled: true
  metadata_dir: /blue/ewhite/b.weinstein/BOEM/metadata_aflight_csvs
  n_sample_crops: 5
  n_rare_species: 2
  rare_species_min_score: 0.7

# Flythrough video: generate from cached predictions and log to Comet at end of run.
flythrough_video:
  enabled: true
  # output_dir: null  # default: /blue/ewhite/b.weinstein/BOEM/flight_videos
