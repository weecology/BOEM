force_train: True
checkpoint:
checkpoint_dir: /blue/ewhite/b.weinstein/BOEM/training/classification/checkpoints/
image_dir: /blue/ewhite/b.weinstein/BOEM/training/crops/
train_crop_image_dir:  /blue/ewhite/b.weinstein/BOEM/training/classification/crops/train
val_crop_image_dir:  /blue/ewhite/b.weinstein/BOEM/training/classification/crops/val
fast_dev_run: False
max_epochs: 45
lr: 0.00001
batch_size: 96
workers: 8
expand: 30
balance_classes: false
# Cap on train-set class balancing: each class is downsampled to at most
# class_balance_factor * median(class_counts) crops (see gentle_class_balance in
# scripts/USGS_classification.py). Override on the CLI to bracket its effect, e.g.
# classification_model.class_balance_factor=2.0, or =null to disable downsampling entirely.
class_balance_factor: 4.0
use_metadata: true
metadata_dim: 32
metadata_dropout: 0.5
# metadata_dir defaults to report.metadata_dir when use_metadata is true.
