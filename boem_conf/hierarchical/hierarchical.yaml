# H-CAST hierarchical taxonomy model (optional)
# Set checkpoint to null to disable; pipeline skips loading when null
#
# Trained in-repo by submit_USGS_hierarchical.sh (job 40306075, 2026-08-26 -> 2026-08-28),
# 72/50/18 heads, best Species@1 77.56 over 100 epochs on the buffer_30/2b27e044 val split
# (the same split CropModel 2b27e0442e51469c9cce3fa51927d741 trained on). Promoted by hand
# on 2026-08-31 from output/usgs_hier/run_40306075/best_checkpoint.pth; the superseded broken
# checkpoint is kept alongside as best_checkpoint.broken_40263761_ep5.pth.
#
# The 72 species heads include five indeterminate "X sp" classes (Aythya/Calonectris/Larus/
# Sterna sp with real genus+family ids, Delphinidae sp with a synthetic genus id) plus the
# turtle class Chelonioidea sp -- see commit 9d2d68c. species.csv below was regenerated for
# this checkpoint with scripts/build_hcast_label_csv.py off the same split.
#
# History: job 39614374 (2026-08-20) trained the previous 68/49/18 / 76.72 checkpoint on the
# a3dc30a0 split; job 40263761 (2026-08-26) crashed at epoch 7 and overwrote it in place with
# no backup, which is why the retrain path now writes to output/usgs_hier/run_<jobid>/ and
# promotion is manual. The Dec 2025 out-of-repo usgs_hvit_c2f_b128 checkpoint measured 12.81%
# species accuracy at the pipeline's geometry -- see JOB_LEDGER.md 39811016+39811745.
checkpoint: /blue/ewhite/b.weinstein/src/BOEM/output/usgs_hier/best_checkpoint.pth
# CSV with columns: species, genus, family (optional "index" = species class index,
# optional "genus_index"/"family_index" = genus/family class indices). If null, numeric labels are used.
# Must match the checkpoint's head ordering -- regenerate with scripts/build_hcast_label_csv.py
# from the same split CSVs the checkpoint was trained on, never hand-edit.
label_csv: /blue/ewhite/b.weinstein/src/BOEM/output/usgs_hier/species.csv
batch_size: 16
workers: 4

# Crop geometry at inference. These MUST match how the checkpoint was trained --
# otherwise H-CAST classifies a different crop than it learned on.
# scripts/USGS_hierarchical.py trains with --expand-pixels (default 30), squares the
# expanded box, and validates at eval_crop_ratio 0.875. Measured on the val split:
# this geometry gives 76.72 Species@1 vs 62.66 for the old expand-0/no-square/squash
# path, i.e. +14.06 points, of which +12.79 is the expand buffer alone.
# If square is ever set false, eval_crop_ratio MUST be null (squash): centre-cropping a
# non-square crop discards the long axis and costs ~27 points.
expand: 30
square: true
eval_crop_ratio: 0.875
