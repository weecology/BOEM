[project]
name = "boem"
description = "BOEM bird detection and classification pipeline"
readme = "README.md"
requires-python = ">=3.10"
version = "0.0.0"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "hydra-core",
  "omegaconf",
  "geopandas",
  "rasterio",
  "dask",
  "dask_jobqueue",
  "bokeh",
  "matplotlib",
  "paramiko",
  "torch>=2.4,<2.5",
  "torchvision>=0.19,<0.20",
  "torchmetrics",
  "pytorch-lightning",
  "label-studio-sdk",
  "label-studio-converter",
  "comet-ml",
  "deepforest",
  "globus-sdk",
  "timm",
  "opencv-contrib-python",
  "dgl>=2.0,<2.2",
  "torchdata>=0.5,<0.9",
  "pytest",
  "python-dotenv>=1.2.1",
  "dotenv",
  "scikit-learn",
]

# PyTorch 2.4 + CUDA 12.1. DGL from PyPI (CPU); for GPU DGL see README (data.dgl.ai wheels often return 403).
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121" },
]
torchvision = [
  { index = "pytorch-cu121" },
]
deepforest = { git = "https://github.com/weecology/DeepForest.git", branch = "main" }
