[project]
name = "boem"
description = "BOEM bird detection and classification pipeline"
readme = "README.md"
requires-python = ">=3.10"
version = "0.0.0"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "hydra-core",
  "omegaconf",
  "geopandas",
  "rasterio",
  "dask",
  "dask_jobqueue",
  "bokeh",
  "matplotlib",
  "paramiko",
  "torch",
  "torchvision",
  "torchmetrics",
  "pytorch-lightning",
  "label-studio-sdk",
  "label-studio-converter",
  "comet-ml",
  "deepforest",
  "globus-sdk",
  "timm",
  "opencv-contrib-python-headless",
  "torchdata>=0.5,<0.9; python_version < '3.13'",
  "pytest",
  "python-dotenv>=1.2.1",
  "dotenv",
  "scikit-learn",
  "folium",
  "contextily",
  "pillow",
]

# PyTorch + CUDA 12.8 (for A100/H100 and other large GPUs)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# Only one OpenCV variant; we need contrib for cv2.ximgproc (e.g. createSuperpixelSEEDS).
# Override other variants to never be selected so opencv-contrib-python-headless is the sole cv2 provider.
override-dependencies = [
  "opencv-python-headless; sys_platform == 'nonexistent'",
  "opencv-python; sys_platform == 'nonexistent'",
  "opencv-contrib-python; sys_platform == 'nonexistent'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
deepforest = { git = "https://github.com/weecology/DeepForest.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: model training or full checkpoint load; run with pytest -m slow",
]
