[project]
name = "boem"
description = "BOEM bird detection and classification pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
version = "1.0.0"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "hydra-core",
  "omegaconf",
  "geopandas",
  "rasterio",
  "dask",
  "dask_jobqueue",
  "bokeh",
  "matplotlib",
  "paramiko",
  "torch",
  "torchvision",
  "torchmetrics",
  "pytorch-lightning",
  "label-studio-sdk",
  "label-studio-converter",
  "comet-ml",
  "deepforest",
  "globus-sdk",
  "timm",
  "opencv-contrib-python-headless",
  "torchdata>=0.5,<0.9; python_version < '3.13'",
  "pytest",
  "python-dotenv>=1.2.1",
  "dotenv",
  "scikit-learn",
  "scikit-image",
  "folium",
  "contextily",
  "pillow",
]

# PyTorch + CUDA 12.8 (for A100/H100 and other large GPUs)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# Only one OpenCV variant; we need contrib for cv2.ximgproc (e.g. createSuperpixelSEEDS).
# Override other variants to never be selected so opencv-contrib-python-headless is the sole cv2 provider.
override-dependencies = [
  "opencv-python-headless; sys_platform == 'nonexistent'",
  "opencv-python; sys_platform == 'nonexistent'",
  "opencv-contrib-python; sys_platform == 'nonexistent'",
]

[tool.uv.sources]
# Detection needs tmp/hpc-balanced-empty-frames; restore this line once the DeepForest PR merges to main.
# deepforest = { git = "https://github.com/bw4sz/DeepForest.git", branch = "tmp/hpc-balanced-empty-frames" }
# Temporary: classification needs claude/friendly-beaver (CropModel.load_from_disk(metadata_csv=...), weecology PR #1334).
# Branch detector-architecture-comparison ONLY: DINOv3 RetinaNet + HF DETR (weecology/DeepForest PR #1473,
# commit ac213f01). Drops friendly-beaver's CropModel metadata support -- use this venv for detection
# training/eval experiments only, never for the classification pipeline.
deepforest = { git = "https://github.com/jveitchmichaelis/DeepForest.git", rev = "ac213f010e91f7f42982d7d9c3607da9d175758b" }

torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: model training or full checkpoint load; run with pytest -m slow",
]
